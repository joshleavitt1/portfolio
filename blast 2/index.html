<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blast</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#092C7E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="game-mount"></main>

    <script src="level-plan.js"></script>
    <script src="index.js"></script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const mount = document.getElementById("game-mount");
        if (!mount || typeof window.createNumberBlastGame !== "function") return;
      
        function showHome() {
          mount.innerHTML = `
            <div class="nb-home">
              <div class="nb-home-inner">
                <img class="nb-home-logo" src="images/logo.png" alt="Blast Math" />
      
                <div class="nb-home-actions">
                  <button id="nb-classic-btn" class="nb-home-btn nb-home-btn--blue" type="button">
                    Classic
                  </button>
      
                  <button id="nb-adventure-btn" class="nb-home-btn nb-home-btn--green" type="button">
                    Adventure
                  </button>
                </div>
              </div>
            </div>
          `;
      
          const classicBtn = document.getElementById("nb-classic-btn");
          const adventureBtn = document.getElementById("nb-adventure-btn");
      
          classicBtn?.addEventListener("pointerdown", async () => {
            const game = window.createNumberBlastGame({
              config: { mount, level: 1, mode: "classic" }
            });
            await game.start();
          });
      
          adventureBtn?.addEventListener("pointerdown", () => {
            console.log("Adventure mode coming next.");
            // future:
            // const game = window.createNumberBlastGame({
            //   config: { mount, level: 1, mode: "adventure" }
            // });
            // game.start();
          });
        }
      
        showHome();
      });
      </script>
  </body>
</html>
