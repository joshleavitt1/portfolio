<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:wght@400;600&family=Source+Serif+Pro:ital,wght@1,400;1,800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --reveal-duration: 0.6s;
        --reveal-delay: 0s;
        --reveal-buffer: 0.2s;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background-color: #000637;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .site-header {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 80px 120px 0px 120px;
        box-sizing: border-box;
      }

      .logo-mark {
        width: 64px;
        height: 64px;
      }

      .logo-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .logo-text {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 24px;
        color: #ffffff;
      }

      .role-list {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.48);
      }

      .role-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.48);
      }

      .hero {
        display: flex;
        gap: 80px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 80px 120px 80px 120px;
        box-sizing: border-box;
      }

      .hero-content {
        width: 100%;
      }

      .hero-image {
        width: 350px;
        height: 350px;
        object-fit: cover;
        border-radius: 8px;
        margin-left: auto;
      }

      .logo-carousel {
        width: calc(100% - 240px);
        margin: 0 120px 120px;
        padding: 24px 0;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        mask-image: linear-gradient(
          to right,
          rgba(0, 0, 0, 0),
          rgba(0, 0, 0, 1) 10%,
          rgba(0, 0, 0, 1) 90%,
          rgba(0, 0, 0, 0)
        );
        -webkit-mask-image: linear-gradient(
          to right,
          rgba(0, 0, 0, 0),
          rgba(0, 0, 0, 1) 10%,
          rgba(0, 0, 0, 1) 90%,
          rgba(0, 0, 0, 0)
        );
      }

      .logo-track {
        display: flex;
        gap: 24px;
        width: max-content;
        animation: logo-scroll 30s linear infinite;
      }

      .logo-item {
        min-width: 200px;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo-item img {
        display: block;
        filter: brightness(0) invert(1);
      }

      .logo-item img.no-filter {
        filter: none;
      }

      @keyframes logo-scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      h1 {
        color: #ffffff;
        font-family: 'Source Serif 4', 'Source Serif Pro', serif;
        font-weight: 900;
        font-size: 64px;
        line-height: 72px;
        text-align: left;
        margin: 0 0 32px;
      }

      h1 em {
        font-family: 'Source Serif Pro', serif;
        font-style: italic;
        font-weight: 800;
      }

      p {
        color: rgba(255, 255, 255, 0.48);
        font-family: 'Inter', sans-serif;
        font-weight: 200;
        font-size: 20px;
        line-height: 1.5;
        margin: 0 0 40px;
      }

      button {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.24);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 900;
        height: 64px;
        padding: 0 24px;
        cursor: pointer;
        border-radius: 4px;
        transition: color 0.3s ease, background-color 0.3s ease;
      }

      button:hover,
      button:focus-visible {
        background-color: #ffffff;
        color: #000c2a;
      }

      .reveal {
        opacity: 0;
        transform: translateY(24px);
        transition:
          opacity var(--reveal-duration) ease,
          transform var(--reveal-duration) ease;
      }

      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      @media (max-width: 900px) {
        body {
          align-items: center;
        }

        .site-header {
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 32px;
        }

        .hero {
          flex-direction: column;
          align-items: center;
          padding: 48px 32px;
          text-align: center;
          min-height: auto;
        }

        .hero-content {
          max-width: none;
          text-align: center;
        }

        h1,
        p {
          text-align: center;
        }

        .hero-image {
          margin-left: 0;
        }

        .logo-carousel {
          width: calc(100% - 64px);
          margin: 0 32px 64px;
        }
      }
    </style>
  </head>
    <body>
      <header class="site-header reveal">
        <img src="images/logo.svg" alt="Josh Leavitt monogram" class="logo-mark" />
        <div class="logo-details">
          <span class="logo-text">Josh Leavitt</span>
          <div class="role-list">
            <span class="role">Designer</span>
            <span class="role-dot" aria-hidden="true"></span>
            <span class="role">Strategist</span>
            <span class="role-dot" aria-hidden="true"></span>
            <span class="role">Leader</span>
          </div>
        </div>
      </header>
      <div class="hero">
      <div class="hero-content reveal">
        <h1>Design that accelerates <em>strategic advantage</em></h1>
        <p>
          I’ve spent over a decade leading Fortune 500 design teams, transforming complex ecosystems into experiences that sharpen strategy and deliver measurable business results.
        </p>
        <button type="button">Download Resume</button>
      </div>
      <img
        src="images/headshot.png"
        alt="Portrait of the designer"
        width="350"
        height="350"
        class="hero-image reveal"
      />
    </div>
    <section class="logo-carousel reveal" aria-label="Companies I've worked with">
      <div class="logo-track">
        <div class="logo-item">
          <img src="images/logos/aig.svg" alt="AIG logo" width="64px" height="35px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/amex.svg" alt="American Express logo" width="48px" height="48px" class="no-filter" />
        </div>
        <div class="logo-item">
          <img src="images/logos/blackrock.svg" alt="BlackRock logo" width="96px" height="14px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/dupont.svg" alt="Dupont logo" width="86px" height="25px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/pimco.svg" alt="PIMCO logo" width="90px" height="17px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/verizon.svg" alt="Verizon logo" width="86px" height="19px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/aig.svg" alt="AIG logo" width="64px" height="35px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/amex.svg" alt="American Express logo" width="48px" height="48px" class="no-filter" />
        </div>
        <div class="logo-item">
          <img src="images/logos/blackrock.svg" alt="BlackRock logo" width="96px" height="14px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/dupont.svg" alt="Dupont logo" width="86px" height="25px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/pimco.svg" alt="PIMCO logo" width="90px" height="17px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/verizon.svg" alt="Verizon logo" width="86px" height="19px" />
        </div>
      </div>
    </section>
    <script>
      const toMilliseconds = (timeValue) => {
        const trimmed = timeValue.trim();
        const numericValue = parseFloat(trimmed);
        if (Number.isNaN(numericValue)) return 0;
        return trimmed.endsWith('ms') ? numericValue : numericValue * 1000;
      };

      window.addEventListener('DOMContentLoaded', () => {
        const rootStyles = getComputedStyle(document.documentElement);
        const revealDuration = toMilliseconds(
          rootStyles.getPropertyValue('--reveal-duration') || '0.6s'
        );
        const revealDelay = toMilliseconds(
          rootStyles.getPropertyValue('--reveal-delay') || '0s'
        );
        const revealBuffer = toMilliseconds(
          rootStyles.getPropertyValue('--reveal-buffer') || '0.2s'
        );
        const revealElements = Array.from(document.querySelectorAll('.reveal'));

        revealElements.forEach((element, index) => {
          const totalDelay =
            revealDelay +
            revealBuffer +
            index * (revealDuration + revealBuffer * 2);
          setTimeout(() => {
            element.classList.add('is-visible');
          }, totalDelay);
        });
      });
    </script>
  </body>
</html>
