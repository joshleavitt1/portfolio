<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Source+Serif+4:wght@400;600&family=Source+Serif+Pro:ital,wght@1,400;1,800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        overflow-x: hidden;
        position: relative;
        isolation: isolate;
        background: #000c2a; /* deep navy base */
      }

      .background-circle {
        position: absolute;
        width: 1000px;
        height: 1000px;
        background: #0f51ff;
        border-radius: 50%;
        top: -120px;
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: -3;
        filter: blur(50px);
      }

      .background-circle--navy {
        background: #000c2a;
        top: 40px;
        width: 2000px;
        height: 2000px;
        z-index: -2;
      }

      .site-header {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 0 32px;
        margin: 64px auto 0;
        height: 64px;
        box-sizing: border-box;
        background: rgba(0, 0, 0, 0.16);
        border-radius: 999px;
        color: #ffffff;
      }

      .logo-details {
        display: inline-flex;
        align-items: center;
        gap: 24px;
        width: 100%;
      }

      .logo-text {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 16px;
        color: #ffffff;
        display: inline-block;
        letter-spacing: -0.01em;
      }

      .role-list {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 400;
        color: #ffffff;
        white-space: nowrap;
      }

      .role-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.48);
      }

      .role {
        font-size: 14px;
        font-weight: 400;
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 24px;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 64px 120px 64px 120px;
        box-sizing: border-box;
        text-align: center;
      }

      .hero-content {
        width: 100%;
        max-width: 100%;
      }

      .logo-carousel {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto 120px;
        padding: 24px 0;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        mask-image: linear-gradient(
          to right,
          rgba(0, 0, 0, 0),
          rgba(0, 0, 0, 1) 10%,
          rgba(0, 0, 0, 1) 90%,
          rgba(0, 0, 0, 0)
        );
        -webkit-mask-image: linear-gradient(
          to right,
          rgba(0, 0, 0, 0),
          rgba(0, 0, 0, 1) 10%,
          rgba(0, 0, 0, 1) 90%,
          rgba(0, 0, 0, 0)
        );
      }

      .logo-track {
        display: flex;
        gap: 24px;
        width: max-content;
        animation: logo-scroll 30s linear infinite;
      }

      .logo-item {
        min-width: 200px;
        min-height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo-item img {
        display: block;
        filter: brightness(0) invert(1);
      }

      .logo-item img.no-filter {
        filter: none;
      }

      @keyframes logo-scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }

      h1 {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 56px;
        line-height: 120%;
        letter-spacing: -0.04em;
        text-align: center;
        margin: 0 0 32px;
        color: #ffffff;
      }

      p {
        color: rgba(255, 255, 255, 0.48);
        font-family: 'Inter', sans-serif;
        font-weight: 200;
        font-size: 20px;
        line-height: 1.5;
        letter-spacing: -0.02em;
        margin: 0 0 40px;
      }

      button {
        background: linear-gradient(135deg, #00c8ff, #0009ff);
        border: none;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.02em;
        height: 56px;
        padding: 0 24px;
        cursor: pointer;
        border-radius: 9999px;
        box-shadow: 0 0 40px #0009ff;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover,
      button:focus-visible {
        transform: translateY(-4px);
        background: linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.08)
          ),
          linear-gradient(135deg, #00c8ff, #0009ff);
      }

      @media (max-width: 900px) {
        body {
          align-items: center;
        }

        .site-header {
          margin: 48px 16px 0;
          width: calc(100% - 32px);
          justify-content: center;
        }

        .hero {
          flex-direction: column;
          align-items: center;
          padding: 48px 32px;
          text-align: center;
          min-height: auto;
        }

        .hero-content {
          max-width: none;
          text-align: center;
        }

        h1,
        p {
          text-align: center;
        }

        .logo-carousel {
          width: calc(100% - 64px);
          max-width: none;
          margin: 0 32px 64px;
        }

      }
    </style>
  </head>
  <body>
    <div class="background-circle background-circle--navy" aria-hidden="true"></div>
    <div class="background-circle" aria-hidden="true"></div>
      <header class="site-header reveal">
        <div class="logo-details">
          <span class="logo-text">Josh Leavitt</span>
          <div class="role-list">
            <span class="role">Designer</span>
            <span class="role">/</span>
            <span class="role">Strategist</span>
            <span class="role">/</span>
            <span class="role">Leader</span>
          </div>
        </div>
      </header>
      <div class="hero">
        <div class="hero-content">
          <h1>Design leader who drives clarity, craft, and impact across the financial sector</h1>
          <p>
            10+ years leading design teams and creating experiences that empower clients and deliver measurable results.
          </p>
        </div>
        <button type="button">Download Resume</button>
      </div>
    <section class="logo-carousel" aria-label="Companies I've worked with">
      <div class="logo-track">
        <div class="logo-item">
          <img src="images/logos/aig.svg" alt="AIG logo" width="64px" height="35px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/amex.svg" alt="American Express logo" width="48px" height="48px" class="no-filter" />
        </div>
        <div class="logo-item">
          <img src="images/logos/blackrock.svg" alt="BlackRock logo" width="96px" height="14px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/citizens.svg" alt="Citizens logo" width="116px" height="13px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/pimco.svg" alt="PIMCO logo" width="90px" height="17px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/aig.svg" alt="AIG logo" width="64px" height="35px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/amex.svg" alt="American Express logo" width="48px" height="48px" class="no-filter" />
        </div>
        <div class="logo-item">
          <img src="images/logos/blackrock.svg" alt="BlackRock logo" width="96px" height="14px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/citizens.svg" alt="Citizens logo" width="116px" height="13px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/pimco.svg" alt="PIMCO logo" width="90px" height="17px" />
        </div>
        <div class="logo-item">
          <img src="images/logos/aig.svg" alt="AIG logo" width="64px" height="35px" />
        </div>
      </div>
    </section>
  </body>
</html>
