<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Source+Serif+4:wght@400;600&family=Source+Serif+Pro:ital,wght@1,400;1,800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        position: relative;
        overflow-x: hidden;
        background: #F7F7FD;
      }

      .page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
        padding: clamp(24px, 5vw, 64px) clamp(16px, 6vw, 80px);
        box-sizing: border-box;
      }

      .hero-shell {
        position: relative;
        width: min(1100px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .hero-backdrop {
        position: absolute;
        width: 700px;
        height: 700px;
        left: 50%;
        top: 20px;
        transform: translateX(-50%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
      }

      .hero-backdrop::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #eaf0f8 0%, #f6f7fa 100%);
        border-radius: 50%;
        filter: blur(100px);
      }

      .hero-backdrop::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.85) 0 2px, transparent 2px 40px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.85) 0 2px, transparent 2px 40px);
          mask-image: radial-gradient(
  circle at 50% 50%,
  rgba(255,255,255,1) 42%,
  rgba(255,255,255,0.6) 50%,
  rgba(255,255,255,0) 65%
);
        opacity: 0.65;
      }

      .site-header {
        display: flex;
        align-items: center;
        justify-content: center;
        align-self: center;
        position: relative;
        z-index: 1;
        margin-top: clamp(32px, 5vw, 72px);
      }

      .immersive-reveal {
        --reveal-delay: 0ms;
        position: relative;
        opacity: 0;
        transform: translateY(32px) scale(0.985);
        filter: blur(18px) saturate(0.8);
        transition:
          opacity 900ms cubic-bezier(0.16, 1, 0.3, 1),
          transform 900ms cubic-bezier(0.16, 1, 0.3, 1),
          filter 900ms cubic-bezier(0.16, 1, 0.3, 1);
        transition-delay: var(--reveal-delay);
      }

      .immersive-reveal::after {
        content: "";
        position: absolute;
        inset: -6%;
        background: radial-gradient(circle at 50% 50%, #ffffff0f, transparent 55%);
        opacity: 0;
        filter: blur(30px);
        transition: opacity 1600ms ease, filter 1200ms ease;
        pointer-events: none;
        z-index: -1;
      }

      .immersive-reveal.in-view {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0) saturate(1);
      }

      .immersive-reveal.in-view::after {
        opacity: 1;
        filter: blur(12px);
      }

      .headshot-image {
        width: 200px;
        height: 200px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        max-width: 1000px;
        margin: 0 auto;
        padding: clamp(32px, 6vw, 80px) clamp(24px, 8vw, 120px)
          clamp(64px, 8vw, 120px);
        box-sizing: border-box;
        text-align: center;
        position: relative;
        z-index: 1;
      }

      .hero-content {
        width: 100%;
        max-width: 900px;
      }

      .hero p {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

        h1 {
          font-family: 'Inter', sans-serif;
          font-weight: 500;
          font-size: 56px;
          line-height: 110%;
          letter-spacing: -0.04em;
          text-align: center;
          margin: 0 0 16px;
          color: #0f172a;
        }

        .financial-sector {
          display: block;
          color: #084fff;
        }

        p {
          color: #737373;
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        font-size: 20px;
        line-height: 160%;
        letter-spacing: -0.02em;
        margin: 0 0 40px;
      }

        button,
        .resume-button {
          background: #084fff;
          border: none;
          color: #ffffff;
          font-family: 'Inter', sans-serif;
          font-size: 16px;
          font-weight: 600;
          height: 56px;
          padding: 0 32px;
          cursor: pointer;
          border-radius: 4px;
          box-shadow: 0 12px 24px rgba(55, 98, 227, 0.4);
          transition:
            opacity 1100ms cubic-bezier(0.16, 1, 0.3, 1),
            filter 1200ms cubic-bezier(0.16, 1, 0.3, 1),
            transform 0.2s ease,
            box-shadow 0.2s ease;
        }

      button:hover,
      button:focus-visible,
      .resume-button:hover,
      .resume-button:focus-visible {
        transform: translateY(-4px);
        background: linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.08),
            rgba(255, 255, 255, 0.08)
          ),
          #084fff;
      }

      .resume-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }

      @media (max-width: 900px) {
        .page {
          justify-content: flex-start;
          padding: 24px 16px 48px;
        }

        .site-header {
          margin: 32px 16px 0;
          width: auto;
          max-width: calc(100% - 32px);
          justify-content: center;
        }

        .hero {
          flex-direction: column;
          align-items: center;
          padding: 32px 16px 48px;
          text-align: center;
          min-height: auto;
          max-width: 600px;
          gap: 24px;
        }

        .hero-content {
          max-width: none;
          text-align: center;
        }

        .hero p {
          display: none;
        }

        h1,
        p {
          text-align: center;
        }

        h1 {
          font-size: 40px;
          background: none;
          -webkit-background-clip: initial;
          -webkit-text-fill-color: #0f172a;
          color: #0f172a;
        }

      }

      @media (prefers-reduced-motion: reduce) {
        .immersive-reveal,
        .immersive-reveal::after {
          transition: none;
          animation: none;
          transform: none;
          filter: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="hero-shell">
        <div class="hero-backdrop" aria-hidden="true"></div>
        <header class="site-header immersive-reveal" data-delay="0ms">
          <img
            src="images/headshot.png"
            alt="Headshot of Josh Leavitt"
            class="headshot-image"
          />
        </header>
        <div class="hero">
          <div class="hero-content immersive-reveal" data-delay="200ms">
            <h1>
              UX leader who drives clarity, craft, and impact across the
              <span class="financial-sector">financial sector</span>
            </h1>
            <p>
              10+ years leading UX teams and creating experiences that empower clients and deliver measurable results.
            </p>
          </div>
          <a
            class="resume-button immersive-reveal"
            href="images/josh_leavitt_casestudy.pdf"
            target="_blank"
            rel="noopener noreferrer"
            data-delay="400ms"
          >
            Download Case Study
          </a>
        </div>
      </div>
    </div>
    <script>
      const stagedElements = [
        { selector: '.site-header', delay: 100 },
        { selector: '.hero-content', delay: 300 },
        { selector: '.resume-button', delay: 1000 },
      ]
        .map(({ selector, delay }) => {
          const element = document.querySelector(selector);
          return element ? { element, delay } : null;
        })
        .filter(Boolean);

      const stagedElementNodes = stagedElements.map(({ element }) => element);

      const revealElements = Array.from(
        document.querySelectorAll('.immersive-reveal')
      ).filter((element) => !stagedElementNodes.includes(element));

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view');
              observer.unobserve(entry.target);
            }
          });
        },
        {
          root: null,
          rootMargin: '0px 0px -10% 0px',
          threshold: 0.25,
        }
      );

      revealElements.forEach((element, index) => {
        const delay = element.dataset.delay || `${Math.min(index * 90, 540)}ms`;
        element.style.setProperty('--reveal-delay', delay);
        observer.observe(element);
      });

      stagedElements.forEach(({ element, delay }) => {
        const delayValue = Number.isFinite(delay) ? delay : 0;
        element.style.setProperty('--reveal-delay', `${delayValue}ms`);

        window.setTimeout(() => {
          element.classList.add('in-view');
        }, delayValue + 60);
      });
    </script>
  </body>
</html>
