<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:wght@400;600&family=Source+Serif+Pro:ital,wght@1,400;1,800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #000c2a;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
      }

      .site-header {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 80px 120px 0px 120px;
        box-sizing: border-box;
      }

      .logo-mark {
        width: 56px;
        height: 56px;
      }

      .logo-details {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .logo-text {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 24px;
        color: #ffffff;
      }

      .role-list {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 400;
        color: rgba(255, 255, 255, 0.48);
      }

      .role-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.48);
      }

      .hero {
        display: flex;
        gap: 80px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 80px 120px 80px 120px;
        box-sizing: border-box;
      }

      .hero-content {
        width: 100%;
      }

      .hero-image {
        width: 350px;
        height: 350px;
        object-fit: cover;
        border-radius: 8px;
        margin-left: auto;
      }

      h1 {
        color: #ffffff;
        font-family: 'Source Serif 4', 'Source Serif Pro', serif;
        font-weight: 800;
        font-size: 64px;
        line-height: 72px;
        text-align: left;
        margin: 0 0 32px;
      }

      p {
        color: rgba(255, 255, 255, 0.48);
        font-family: 'Inter', sans-serif;
        font-weight: 200;
        font-size: 24px;
        line-height: 1.5;
        margin: 0 0 40px;
      }

      button {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.24);
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 20px;
        font-weight: 800;
        height: 64px;
        padding: 0 24px;
        cursor: pointer;
        border-radius: 4px;
        transition: color 0.3s ease, background-color 0.3s ease;
      }

      button:hover,
      button:focus-visible {
        background-color: #ffffff;
        color: #000c2a;
      }

      @media (max-width: 900px) {
        body {
          align-items: center;
        }

        .site-header {
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 32px;
        }

        .hero {
          flex-direction: column;
          align-items: center;
          padding: 48px 32px;
          text-align: center;
          min-height: auto;
        }

        .hero-content {
          max-width: none;
          text-align: center;
        }

        h1,
        p {
          text-align: center;
        }

        .hero-image {
          margin-left: 0;
        }
      }
    </style>
  </head>
    <body>
      <header class="site-header">
        <img src="images/logo.svg" alt="Josh Leavitt monogram" class="logo-mark" />
        <div class="logo-details">
          <span class="logo-text">Josh Leavitt</span>
          <div class="role-list">
            <span class="role">Designer</span>
            <span class="role-dot" aria-hidden="true"></span>
            <span class="role">Strategist</span>
            <span class="role-dot" aria-hidden="true"></span>
            <span class="role">Leader</span>
          </div>
        </div>
      </header>
      <div class="hero">
      <div class="hero-content">
        <h1>Design that accelerates <em>strategic advantage</em></h1>
        <p>
          Over a decade of experience leading Fortune 500 design teams, creating
          customer-centric experiences that deliver meaningful results and drive
          profitable growth.
        </p>
        <button type="button">Download Resume</button>
      </div>
      <img
        src="images/headshot.png"
        alt="Portrait of the designer"
        width="350"
        height="350"
        class="hero-image"
      />
    </div>
  </body>
</html>
