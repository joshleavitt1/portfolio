<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Source+Serif+4:wght@400;600&family=Source+Serif+Pro:ital,wght@1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background-color: #000c2a;
        font-family: 'Source Serif 4', 'Source Serif Pro', serif;
      }

      .hero {
        display: flex;
        gap: 80px;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        min-height: 100vh;
        padding: 80px 120px 80px 1200px;
        box-sizing: border-box;
      }

      .hero-content {
        width: 100%;
      }

      .hero-image {
        width: 350px;
        height: 350px;
        object-fit: cover;
        border-radius: 8px;
        margin-left: auto;
      }

      h1 {
        color: #ffffff;
        font-family: 'Source Serif 4', 'Source Serif Pro', serif;
        font-size: 64px;
        font-weight: 600;
        text-align: left;
        margin: 0 0 32px;
      }

      .hero-title-line {
        display: block;
      }

      .hero-title-line--light {
        font-weight: 200;
      }

      .hero-title-line--italic {
        font-family: 'Source Serif Pro', serif;
        font-style: italic;
        font-weight: 800;
      }

      p {
        color: #8c94a4;
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 24px;
        line-height: 1.5;
        margin: 0 0 40px;
      }

      button {
        background: transparent;
        border: 2px solid #ffffff;
        color: #ffffff;
        font-family: 'Inter', sans-serif;
        font-size: 18px;
        font-weight: 500;
        height: 64px;
        padding: 0 24px;
        cursor: pointer;
        border-radius: 4px;
      }

      @media (max-width: 900px) {
        .hero {
          flex-direction: column;
          padding: 48px 32px;
          text-align: center;
          min-height: auto;
        }

        .hero-content {
          max-width: none;
        }

        h1,
        p {
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="hero-content">
        <h1>
          <span class="hero-title-line hero-title-line--light"
            >Design that accelerates</span
          >
          <span class="hero-title-line hero-title-line--italic"
            >strategic advantage</span
          >
        </h1>
        <p>
          Over a decade of experience leading Fortune 500 design teams, creating
          customer-centric experiences that deliver meaningful results and drive
          profitable growth.
        </p>
        <button type="button">Download Resume</button>
      </div>
      <img
        src="images/headshot.png"
        alt="Portrait of the designer"
        width="350"
        height="350"
        class="hero-image"
      />
    </div>
  </body>
</html>
