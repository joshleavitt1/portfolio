<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blast</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#F7F7F7" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="game-mount"></main>

    <script src="level-plan.js"></script>
    <script src="index.js"></script>
    <script>
window.addEventListener("DOMContentLoaded", () => {
  const mount = document.getElementById("game-mount");
  if (!mount || typeof window.createNumberBlastGame !== "function") return;

  mount.innerHTML = `
    <button id="start-game-btn" style="
      width:100%;
      height:100%;
      border:none;
      background:#F7F7F7;
      font:900 28px 'Segoe UI', sans-serif;
      color:#021F63;
      cursor:pointer;
    ">
      Tap to Start
    </button>
  `;

  const btn = document.getElementById("start-game-btn");
  btn.addEventListener("pointerdown", async () => {
    const game = window.createNumberBlastGame({ config: { mount, level: 1 } });
    await game.start();
  }, { once: true });
});
    </script>
  </body>
</html>
