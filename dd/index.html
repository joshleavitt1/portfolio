<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Descent</title>
    <meta
      name="description"
      content="Turn short walks into dungeon runs. Clear checkpoints, earn XP, and get in shape one dungeon at a time."
    />
    <script type="module" crossorigin src="./assets/index-CkvN8sQL.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-53lPhXYJ.css">
  </head>
  <body>
    <div id="app">
      <main class="page">
        <section class="hero">
          <div class="hero__content">
            <p class="kicker">A walking app for hardcore gamers</p>

            <img
              class="logo"
              src="./dungeon-descent-logo.png"
              alt="Dungeon Descent"
            />

            <img
              class="headline-divider"
              src="./divider.png"
              alt=""
              aria-hidden="true"
            />

            <ul class="benefits">
              <li>
                <span class="benefit-icon" aria-hidden="true">
                  <img src="./icon-1.png" alt="" />
                </span>
                <span>Turn short walks into dungeon runs</span>
              </li>
              <li>
                <span class="benefit-icon" aria-hidden="true">
                  <img src="./icon-2.png" alt="" />
                </span>
                <span>Clear checkpoints to earn rewards</span>
              </li>
              <li>
                <span class="benefit-icon" aria-hidden="true">
                  <img src="./icon-3.png" alt="" />
                </span>
                <span>Gain XP, unlock loot, and protect your streak</span>
              </li>
            </ul>

            <form class="signup-form" id="signup-form">
              <input
                id="email"
                type="email"
                placeholder="Enter email"
                autocomplete="email"
                required
              />
              <button type="submit">Join Early Access</button>
            </form>

            <p class="form-message" id="form-message"></p>
          </div>

          <div class="hero__visual">
            <img
              class="hero-image"
              src="./hero-phones.png"
              alt="Dungeon Descent app screens"
            />
          </div>
        </section>
      </main>
    </div>

  </body>
</html>
