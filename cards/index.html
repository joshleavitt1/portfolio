<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Card Quest</title> 
    <!-- Standard responsive viewport (no PWA/web-app flags) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="games/monster-battle/styles.css" />
    <link rel="stylesheet" href="games/equation-cards/styles.css" />
    <link rel="stylesheet" href="games/number-blast/styles.css" />
  </head>
  
    <body>
      <div class="app">
      <!-- Quest Screen (Choose Quest) -->
    <section class="quest-screen" id="quest-screen">
      <div class="quest-content">
        <!-- JS will inject one <button.quest-card> per quest here -->
        <div id="quest-list" class="quest-list"></div>
      </div>
    </section>

<!-- World Map Screen -->
<section class="map-screen map-screen--hidden" id="map-screen">

  <div class="map-nodes" id="map-nodes">
    <button class="map-node" data-node-index="0"></button>
    <button class="map-node" data-node-index="1"></button>
    <button class="map-node" data-node-index="2"></button>
    <button class="map-node" data-node-index="3"></button>
    <button class="map-node" data-node-index="4"></button>
    <button class="map-node" data-node-index="5"></button>
  </div>
</section>

<main class="game stage-intro" id="game-root">
  <!-- Cinematic Stage (Intro + Result) -->
  <section class="cinematic" id="cinematic">
    <div class="cinematic-stage">
      <!-- Hero + Hero Stats -->
      <div class="cinematic-character cinematic-character--hero">
        <img
          alt="Hero"
          class="cinematic-sprite cinematic-sprite--hero"
          id="cinematic-hero"
        />

        <div class="stat-panel stat-panel--hero">
          <div class="stat-panel__name" id="hero-name"></div>
          <div class="stat-panel__health-row">
            <div class="stat-panel__health-track">
              <div
                class="stat-panel__health-fill"
                id="hero-health-fill"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- VS badge -->
      <img
        src="images/global/battle_vs.png"
        alt="Versus"
        class="cinematic-vs"
        id="cinematic-vs"
      />

      <!-- Monster + Monster Stats -->
      <div class="cinematic-character cinematic-character--monster">
        <img
          alt="Monster"
          class="cinematic-sprite cinematic-sprite--monster"
          id="cinematic-monster"
        />

        <div class="stat-panel stat-panel--monster">
          <div class="stat-panel__name" id="monster-name"></div>
          <div class="stat-panel__health-row">
            <div class="stat-panel__health-track">
              <div
                class="stat-panel__health-fill"
                id="monster-health-fill"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Attack overlay (result only) -->
      <img
        alt="Attack"
        class="cinematic-attack"
        id="cinematic-attack"
      />
    </div>
  </section>

  <!-- Universal Game Mount -->
  <section id="game-mount" class="game-mount is-hidden"></section>
</main>

<!-- Reusable Post Message Screen (moved OUTSIDE #game-root) -->
<section id="postmsg" class="postmsg is-hidden" aria-hidden="true">
  <div class="postmsg__bg" aria-hidden="true"></div>

  <div class="postmsg__wrap" role="dialog" aria-modal="true" aria-labelledby="postmsg-title">
    <img id="postmsg-seal" class="postmsg__seal" src="" alt="Wax Seal" />

    <div class="postmsg__text">
      <h2 id="postmsg-title" class="postmsg__title">Title</h2>
      <p id="postmsg-sub" class="postmsg__sub">Sub</p>
    </div>

    <div class="postmsg__actions">
      <button id="postmsg-btn" class="postmsg__btn" type="button">
        Continue
      </button>
      <div id="postmsg-back" class="postmsg__back is-hidden">
        Back
      </div>
    </div>
  </div>
</section>
  </div>

  <!-- Orientation Overlay (shown in portrait on mobile) -->
  <div
    class="orientation-overlay"
    id="orientation-overlay"
    aria-hidden="true"
  >
    <div class="orientation-modal">
      <h2>Mobile Portrait Only</h2>
      <p>
        This game is designed for phones held vertically.
      </p>      
    </div>
  </div>

  <!-- ✅ Script order: stats → difficulty → mini-game engine → main -->
  <script src="registry.js"></script>
  <script src="quest-overview.js"></script>
  <script src="difficulty-service.js"></script>
  <script src="game-runner.js"></script>
  
  <script src="games/equation-cards/index.js"></script>
  <script src="games/monster-battle/battle-stats.js"></script>
  <script src="games/monster-battle/index.js"></script>

  <script src="games/hero-evolution/index.js"></script>
  <script src="postmsg.js"></script>

  <script src="games/number-blast/level-plan.js"></script>
  <script src="games/number-blast/index.js"></script>
  
  <script src="main.js"></script>
  
</body>
</html>
