<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Equation Cards</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Equation Cards" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body>
  <div class="app">
    <main class="game">

      <!-- Cinematic Stage (Intro + Result) -->
      <section class="cinematic" id="cinematic">
        <div class="cinematic-stage">
          <!-- Knight -->
          <img
            src="images/knight.png"
            alt="Knight"
            class="cinematic-sprite cinematic-sprite--knight"
            id="cinematic-knight"
          />

          <!-- VS badge -->
          <img
            src="images/vs.png"
            alt="Versus"
            class="cinematic-vs"
            id="cinematic-vs"
          />

          <!-- Dragon -->
          <img
            src="images/dragon.png"
            alt="Dragon"
            class="cinematic-sprite cinematic-sprite--dragon"
            id="cinematic-dragon"
          />

          <!-- Knight attack overlay (result only) -->
          <img
            src="images/knight_attack.png"
            alt="Knight Attack"
            class="cinematic-attack"
            id="cinematic-attack"
          />
        </div>
      </section>

      <!-- Equation + Puzzle Row -->
      <section class="equation-area">
        <div class="combat-row">
          <div class="equation-rail" id="equation-rail">
            <!-- slots populated by JS -->
          </div>
        </div>
      </section>

      <!-- Card Hand -->
      <section class="hand-area">
        <div class="card-hand" id="card-hand">
          <!-- cards populated by JS -->
        </div>
      </section>
    </main>
  </div>

  <!-- Result Modal -->
  <div
    class="modal-backdrop"
    id="result-modal"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
  >
    <div class="modal">
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-message" id="modal-message"></p>
      <button class="primary-btn" id="modal-primary-btn">
        Play Another
      </button>
    </div>
  </div>

  <!-- Orientation Overlay (shown in portrait on mobile) -->
  <div
    class="orientation-overlay"
    id="orientation-overlay"
    aria-hidden="true"
  >
    <div class="orientation-modal">
      <h2>Turn your device horizontal</h2>
      <p>This game is best played in landscape on mobile.</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
