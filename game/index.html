<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Card Quest</title> 
    <!-- Standard responsive viewport (no PWA/web-app flags) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <link rel="stylesheet" href="styles.css" />
  </head>
  
<body>
  <div class="app">
    <main class="game stage-intro" id="game-root">

      <!-- Cinematic Stage (Intro + Result) -->
      <section class="cinematic" id="cinematic">
        <div class="cinematic-stage">
          <!-- Knight + Hero Stats -->
          <div class="cinematic-character cinematic-character--hero">
            <img
              alt="Knight"
              class="cinematic-sprite cinematic-sprite--knight"
              id="cinematic-knight"
            />
    
            <div class="stat-panel stat-panel--hero">
              <div class="stat-panel__name" id="hero-name"></div>
              <div class="stat-panel__health-row">
                <div class="stat-panel__health-track">
                  <div
                    class="stat-panel__health-fill"
                    id="hero-health-fill"
                  ></div>
                </div>
              </div>
            </div>
          </div>
    
          <!-- VS badge -->
          <img
            src="images/vs.png"
            alt="Versus"
            class="cinematic-vs"
            id="cinematic-vs"
          />
    
          <!-- Dragon + Monster Stats -->
          <div class="cinematic-character cinematic-character--monster">
            <img
              alt="Dragon"
              class="cinematic-sprite cinematic-sprite--dragon"
              id="cinematic-dragon"
            />
    
            <div class="stat-panel stat-panel--monster">
              <div class="stat-panel__name" id="monster-name"></div>
              <div class="stat-panel__health-row">
                <div class="stat-panel__health-track">
                  <div
                    class="stat-panel__health-fill"
                    id="monster-health-fill"
                  ></div>
                </div>
              </div>
            </div>
          </div>
    
          <!-- Knight attack overlay (result only) -->
          <img
            alt="Knight Attack"
            class="cinematic-attack"
            id="cinematic-attack"
          />
        </div>
      </section>
    
      <!-- Equation + Puzzle Row -->
      <section class="equation-area">
        <div class="combat-row">
          <div class="equation-rail" id="equation-rail">
            <!-- slots populated by JS -->
          </div>
        </div>
      </section>
    
      <!-- Card Hand -->
      <section class="hand-area">
        <div class="card-hand" id="card-hand">
          <!-- cards populated by JS -->
        </div>
      </section>
    </main>    
  </div>

  <!-- Result Modal -->
  <div
    class="modal-backdrop"
    id="result-modal"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
  >
    <div class="modal">
      <h2 class="modal-title" id="modal-title"></h2>
      <p class="modal-message" id="modal-message"></p>
      <button class="primary-btn" id="modal-primary-btn">
        Play Another
      </button>
    </div>
  </div>

  <!-- Orientation Overlay (shown in portrait on mobile) -->
  <div
    class="orientation-overlay"
    id="orientation-overlay"
    aria-hidden="true"
  >
    <div class="orientation-modal">
      <h2>Turn your device horizontal</h2>
      <p>This game is best played in landscape on mobile.</p>
    </div>
  </div>
  <script src="battle-stats.js"></script>
  <script src="difficulty-engine.js"></script>
  <script src="main.js"></script>
</body>
</html>
