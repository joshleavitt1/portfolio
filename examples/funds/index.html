<!doctype html><html lang="en"><head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIMCO product journey</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#00243c;font:16px Arial,sans-serif}.screen{position:absolute;inset:0;overflow:hidden;background:#fff}.screen img{display:block;width:1440px;height:auto}.finder{transition:opacity .55s}.search{position:absolute;left:91px;top:408px;width:237px;height:38px;border:0;background:white;color:#00243c;padding:0 42px 0 15px;font:16px Arial;outline:0}.search:focus{box-shadow:inset 0 0 0 2px #00f6ff}.count{position:absolute;left:90px;top:353px;background:#00243c;color:white;padding:5px 0;width:300px;font-size:20px}.results{position:absolute;left:90px;right:90px;top:696px;background:white;min-height:960px}.table-head,.fund{display:grid;grid-template-columns:2.1fr .7fr .9fr 1.2fr .7fr;align-items:center;gap:20px;padding:22px 24px}.table-head{background:#f6f5f2;font-size:13px}.fund{width:100%;border:0;border-bottom:1px solid #d9dce0;background:white;text-align:left;color:#00243c;font:16px Arial;cursor:pointer;min-height:100px}.fund:hover,.fund.highlight{background:#e7fbfc;box-shadow:inset 6px 0 #00f6ff}.fund strong{font-size:20px;font-weight:400;text-decoration:underline;text-underline-offset:4px}.fund small{display:block;font-size:13px;color:#63717b;margin-top:9px}.fund .return{font-weight:700}.empty{padding:30px}.detail{opacity:0;pointer-events:none;transition:opacity .55s}.detail.active{opacity:1;pointer-events:auto}.detail-image{will-change:transform}.back{position:fixed;left:18px;top:15px;border:1px solid #ffffff66;background:#00243c;color:white;border-radius:3px;padding:8px 12px;cursor:pointer;font-size:13px}.source{font-size:12px;color:#64717a;margin:26px 24px}.source a{color:inherit}.status{position:fixed;right:16px;bottom:16px;display:flex;gap:8px;z-index:4}.status button{background:white;color:#00243c;border:1px solid #ccd3d8;padding:8px 12px;border-radius:3px;font-size:12px;cursor:pointer}.demo-cursor{position:absolute;left:260px;top:460px;width:18px;height:25px;background:#00243c;clip-path:polygon(0 0,100% 70%,55% 70%,38% 100%);filter:drop-shadow(0 0 2px white);pointer-events:none;z-index:5;transition:left .7s,top .7s;opacity:0}

html,body{width:1440px;height:1120px;overflow:hidden}.detail-image{position:relative;width:1440px;height:3001px}.chart-bar{position:absolute;width:82px;background:#0071ec;transform:scaleY(0);will-change:transform}.screen{pointer-events:none}.fund{transition:background .45s}.demo-cursor{background:#101c27;filter:drop-shadow(1px 2px 2px #ffffffaa);transition:none}.detail{transition:opacity .75s ease}.finder{transition:opacity .75s ease}
.count{height:54px;top:345px;padding-top:13px;z-index:1}.search{z-index:2}
/* Shared walkthrough cursor: match the white arrow used by Email Studio. */
.demo-cursor{width:27px;height:36px;background:none;clip-path:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))}
</style></head><body>
<div class="screen finder"><img src="assets/finder-updated.svg" alt="PIMCO Product Finder design"><div class="count">Showing 5 Results</div><input class="search" aria-label="Search funds" placeholder="Refine by Keyword" autocomplete="off"><div class="results"><div class="table-head"><span>Fund Name</span><span>Ticker</span><span>Share Class</span><span>Net Assets</span><span>YTD</span></div><div id="rows"></div><p class="source">Fund snapshot as of September 30, 2026 · <a href="https://www.pimco.com/us/en/investment-strategies/income-strategies" target="_blank" rel="noopener">Source: PIMCO</a></p></div></div>
<div class="screen detail"><div class="detail-image"><img src="assets/detail-updated.svg" alt="PIMCO Income Fund detail page design"><span class="chart-bar" style="left:235.801px;top:2321px;height:34.5px;transform-origin:center bottom"></span><span class="chart-bar" style="left:465.4px;top:2282px;height:73.5px;transform-origin:center bottom"></span><span class="chart-bar" style="left:695px;top:2253px;height:102.5px;transform-origin:center bottom"></span><span class="chart-bar" style="left:924.602px;top:2355px;height:59px;transform-origin:center top"></span><span class="chart-bar" style="left:1154.2px;top:2336px;height:19.5px;transform-origin:center bottom"></span></div></div><div class="demo-cursor" aria-hidden="true"><svg width="27" height="36" viewBox="0 0 27 36" fill="none"><path d="M3 2.5 23.5 20l-9.2 1.8 5.5 10.4-5.2 2.5-5.4-10.3-6.2 7.1L3 2.5Z" fill="white" stroke="#0A2540" stroke-width="2" stroke-linejoin="round"/></svg></div>
<script>
const funds=[{name:'PIMCO Income Fund',ticker:'PIMIX',share:'Institutional',assets:'222,523 MM USD',return:'4.8%'},{name:'PIMCO Low Duration Income Fund',ticker:'PFIIX',share:'Institutional',assets:'19,911 MM USD',return:'3.9%'},{name:'PIMCO Total Return Fund',ticker:'PTTRX',share:'Institutional',assets:'68,742 MM USD',return:'4.2%'},{name:'PIMCO Dynamic Income Fund',ticker:'PDI',share:'Common Shares',assets:'6,118 MM USD',return:'8.6%'},{name:'PIMCO Short Term Fund',ticker:'PTSHX',share:'Institutional',assets:'13,409 MM USD',return:'3.7%'}];
const input=document.querySelector('.search'),rows=document.querySelector('#rows'),count=document.querySelector('.count'),finder=document.querySelector('.finder'),detail=document.querySelector('.detail'),page=document.querySelector('.detail-image'),cursor=document.querySelector('.demo-cursor'),bars=[...document.querySelectorAll('.chart-bar')];
input.readOnly=true;input.tabIndex=-1;
let running=false,elapsed=0,last=0,raf=0,phase='',typed='',chartStart=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function render(){const matches=funds.filter(f=>(f.name+' '+f.ticker).toLowerCase().includes(input.value.toLowerCase()));count.textContent='Showing '+matches.length+' Result'+(matches.length===1?'':'s');rows.innerHTML=matches.map(f=>`<div class="fund"><span><strong>${f.name}</strong><small>Mutual Fund · USD</small></span><span>${f.ticker}</span><span>${f.share}</span><span>${f.assets}<small>As of 09/30/2026</small></span><span class="return">${f.return}</span></div>`).join('')}
function ease(x){x=Math.max(0,Math.min(1,x));return x*x*x*(x*(x*6-15)+10)}
function frame(now){if(!running)return;elapsed+=last?Math.min(now-last,80)*2:0;last=now;const t=elapsed/1000;
const delays=[1.7,1.93,2.19,2.46,2.73];const text='PIMIX'.slice(0,delays.filter(d=>t>=d).length);if(text!==typed){typed=text;input.value=text;if(text.length===5)render()}
if(t<7.7){if(phase!=='finder'){detail.classList.remove('active');finder.style.opacity=1;phase='finder';chartStart=null;bars.forEach(b=>b.style.transform='scaleY(0)')}
const move=ease((t-3.6)/1.2);cursor.style.opacity=t>.7?'1':'0';cursor.style.left=(288+40*move)+'px';cursor.style.top=(424+360*move)+'px';cursor.style.transform=t>7.1&&t<7.3?'scale(.86)':'scale(1)';rows.querySelector('.fund')?.classList.toggle('highlight',t>5.2);
}else{if(phase!=='detail'){detail.classList.add('active');finder.style.opacity=0;cursor.style.opacity=0;phase='detail'}
// Keep every walkthrough scroll at the same 400px/second pace. This is
// slightly quicker than the prior average, while retaining a calm movement.
let y=t<11?0:t<20.4?1881*ease((t-11)/9.4):t<23.4?1881:t<32.8?1881*(1-ease((t-23.4)/9.4)):0;page.style.transform=`translateY(${-y}px)`;
if(y>1450&&chartStart===null)chartStart=t;
if(chartStart!==null)bars.forEach((b,i)=>{const progress=ease((t-chartStart-i*.13)/1.15);b.style.transform=`scaleY(${progress})`});}
if(t>=35.8){running=false;cancelAnimationFrame(raf);return}raf=requestAnimationFrame(frame)}
function reset(){elapsed=0;last=0;phase='';typed='';chartStart=null;input.value='';render();finder.style.opacity=1;detail.classList.remove('active');page.style.transform='translateY(0)';cursor.style.opacity='0';cursor.style.transform='scale(1)';rows.querySelectorAll('.fund').forEach(row=>row.classList.remove('highlight'));bars.forEach(bar=>bar.style.transform='scaleY(0)')}
function stop(){running=false;cancelAnimationFrame(raf);reset()}
function play(){if(running||reduced.matches)return;running=true;last=0;raf=requestAnimationFrame(frame)}
render();let approaching=false;window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='demo-visibility')return;approaching=e.data.visible;approaching?play():stop()});document.addEventListener('visibilitychange',()=>document.hidden||!approaching?stop():play());
</script></body></html>
