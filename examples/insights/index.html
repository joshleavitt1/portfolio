<!doctype html><html lang="en"><head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIMCO fund browsing walkthrough</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:1120px;overflow:hidden;background:#fff}#stage{position:absolute;inset:0;width:1440px;height:1120px;overflow:hidden;background:white}.page{position:absolute;inset:0 auto auto 0;width:1440px;will-change:transform}.page img{display:block;width:1440px;height:auto}.page3{opacity:1;transition:opacity .55s ease}.page4{opacity:0;transition:opacity .65s ease}.page4.active{opacity:1}.fund-hover{position:absolute;left:54px;top:700px;width:420px;height:127px;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:13px;padding:0 36px 0 44px;opacity:0;background:rgba(255,255,255,.10);border-left:7px solid #00f6ff;border-radius:2px;box-shadow:none;transform:translateY(6px);pointer-events:none;transition:opacity .28s ease,transform .42s cubic-bezier(.2,.8,.2,1)}.fund-hover.active{opacity:1;transform:translateY(0)}.fund-hover__eyebrow,.fund-hover__title{visibility:hidden}.sticky-banner{position:absolute;left:0;bottom:0;width:1440px;height:94px;z-index:6;transform:translateY(105%);transition:transform .7s cubic-bezier(.22,.8,.25,1);pointer-events:none}.sticky-banner.is-visible{transform:translateY(0);pointer-events:auto}.sticky-banner img{display:block;width:1440px;height:94px}.sticky-close{position:absolute;right:91px;top:17px;width:22px;height:22px;padding:0;border:0;background:transparent;cursor:pointer}.cursor{position:absolute;z-index:4;left:0;top:0;width:27px;height:36px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28));opacity:0;transform-origin:top left;will-change:left,top;pointer-events:none}.cursor.click::after{content:"";position:absolute;inset:-7px;border:2px solid #00d9e5;border-radius:50%;animation:ring .5s ease-out forwards}@keyframes ring{from{transform:scale(.35);opacity:.9}to{transform:scale(1.5);opacity:0}}
</style></head><body><div id="stage"><div class="page page3"><img src="assets/pimco-page3.svg" alt="PIMCO fund results screen, Page 3"><div class="fund-hover" aria-hidden="true"><span class="fund-hover__eyebrow">Credit Market Lens</span><span class="fund-hover__title">An Oil Shock (Mostly) Like No Other</span></div></div><div class="page page4"><img src="assets/pimco-page4.svg" alt="PIMCO fund detail screen, Page 2"></div><div class="cursor" aria-hidden="true"><svg width="27" height="36" viewBox="0 0 27 36" fill="none"><path d="M3 2.5 23.5 20l-9.2 1.8 5.5 10.4-5.2 2.5-5.4-10.3-6.2 7.1L3 2.5Z" fill="white" stroke="#0A2540" stroke-width="2" stroke-linejoin="round"/></svg></div><div class="sticky-banner" aria-label="PIMCO investment insights action banner"><img src="assets/sticky.svg" alt=""><button class="sticky-close" aria-label="Dismiss banner"></button></div></div><script>
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),stage=document.querySelector('#stage'),p3=document.querySelector('.page3'),p4=document.querySelector('.page4'),cursor=document.querySelector('.cursor'),hover=document.querySelector('.fund-hover'),sticky=document.querySelector('.sticky-banner');let running=false,raf=0,last=0,elapsed=0,near=false,stickyShown=false;
const ease=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function place(x,y,alpha=1){cursor.style.left=x+'px';cursor.style.top=y+'px';cursor.style.opacity=alpha}
function draw(now){if(!running)return;elapsed+=last?Math.min(now-last,80)*1.5:0;last=now;const t=elapsed/1000;
// Match the first walkthrough at 400px/second in both directions.
let scroll3=t<1.2?0:t<3.11?510*ease((t-1.2)/1.91):t<6.2?510:t<8.11?510*(1-ease((t-6.2)/1.91)):0;
let scroll4=t<10.4?0:t<15.92?1472*ease((t-10.4)/5.52):t<17.52?1472:t<23.04?1472*(1-ease((t-17.52)/5.52)):0;
p3.style.transform=`translateY(${-scroll3}px)`;p4.style.transform=`translateY(${-scroll4}px)`;if(scroll3>80&&!stickyShown){stickyShown=true;if(!sticky.dataset.dismissed)sticky.classList.add('is-visible')}
if(t<8.11){p4.classList.remove('active');place(300,260,0);hover.classList.remove('active');}
else if(t<9.5){p4.classList.remove('active');const q=ease((t-8.11)/.65);place(170+q*96,740+q*40,1);hover.classList.add('active');if(t>8.8&&!cursor.classList.contains('click'))cursor.classList.add('click');if(t>9.2)cursor.classList.remove('click');}
else{p4.classList.add('active');sticky.classList.remove('is-visible');hover.classList.remove('active');place(760,680,0)}
if(t>=23.04){running=false;cancelAnimationFrame(raf);return}
raf=requestAnimationFrame(draw)}
function reset(){elapsed=0;last=0;stickyShown=false;delete sticky.dataset.dismissed;sticky.classList.remove('is-visible');hover.classList.remove('active');p3.style.transform='translateY(0)';p4.style.transform='translateY(0)';p4.classList.remove('active');cursor.style.opacity='0';cursor.classList.remove('click')}
function stop(){running=false;cancelAnimationFrame(raf);reset()}
function play(){if(running||reduced.matches)return;running=true;last=0;raf=requestAnimationFrame(draw)}
sticky.querySelector('.sticky-close').addEventListener('click',()=>{sticky.classList.remove('is-visible');sticky.dataset.dismissed='true'});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='demo-visibility')return;near=e.data.visible;near?play():stop()});document.addEventListener('visibilitychange',()=>document.hidden||!near?stop():play());
</script></body></html>
